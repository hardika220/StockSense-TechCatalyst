<!DOCTYPE html>
<html lang="en">
  <head>
    
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Browser Theme Color -->
    <meta name="theme-color" content="#071426" />

    <!-- Website Description -->
    <meta
      name="description"
      content="Stocksense - Smart Inventory and Stock Management Dashboard"
    />

    <meta
      name="keywords"
      content="inventory, stock management, shopkeeper, products, delivery, warehouse"
    />

    <meta name="author" content="Stocksense Team" />


    <!-- TITLE -->

    <title>StockPro | Inventory Management</title>


    <!--  GOOGLE FONT -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />


    <!-- INITIAL PAGE STYLING
         Main styling will be handled by
         Tailwind CSS in src/index.css -->

    <style>
      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        padding: 0;
        min-width: 320px;
        min-height: 100vh;

        background-color: #071426;
        color: #ffffff;

        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      #root {
        min-height: 100vh;
      }

      /* default button font */
      button,
      input,
      textarea,
      select {
        font-family: inherit;
      }

      /* Text selection */
      ::selection {
        background-color: #1677ff;
        color: #ffffff;
      }
    </style>
  </head>


  <body>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
